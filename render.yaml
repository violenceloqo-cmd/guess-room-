# Render Blueprint for the Knock Knock backend (the always-on game engine).
# Deploy: Render Dashboard → New → Blueprint → pick this repo.
#
# IMPORTANT:
#  - Use a paid plan (Starter+). The Free plan SLEEPS after ~15 min idle, which
#    would freeze the round loop and stop payouts. The engine must run 24/7.
#  - Keep numInstances at 1. The engine holds authoritative round state in
#    memory; a second instance would run a parallel game.
#  - Secrets (sync:false) are entered in the Render dashboard, never committed.
services:
  - type: web
    # Render keys services by name — keep the existing one so the live backend
    # (and its env vars / URL) survives the rename. Rename in the dashboard if wanted.
    name: room-royale-backend
    runtime: node
    plan: starter
    region: oregon
    numInstances: 1
    healthCheckPath: /health
    buildCommand: npm install && npm run build --prefix packages/shared && npm run build --prefix packages/backend
    startCommand: node packages/backend/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CHAIN_NETWORK
        value: mainnet
      - key: ROUND_POOL_ETH
        value: "0.01"
      - key: ROUND_DURATION_SECONDS
        value: "60"
      - key: ROUND_LOCK_BUFFER_SECONDS
        value: "3"
      - key: ELIMINATION_INTERVAL_SECONDS
        value: "10"
      - key: ROLLOVER_ON_NO_WINNER
        value: "false"
      - key: MAX_PAYOUT_ETH
        value: "5"
      - key: MAX_ROUND_PAYOUT_ETH
        value: "10"
      - key: DRY_RUN
        value: "false"
      # --- Secrets: set these in the Render dashboard (Environment tab) ---
      - key: RPC_URL
        sync: false
      - key: TOKEN_ADDRESS
        sync: false
      - key: HOT_WALLET_SECRET
        sync: false
      - key: HOST_API_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
